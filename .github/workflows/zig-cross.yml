name: Zig C++ Linux AMD64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    env:
      CC: zig cc -target riscv64-linux-musl
      CXX: zig c++ -target riscv64-linux-musl

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git cmake wget xz-utils
        git submodule update --init --recursive --depth=1
        # Install Zig
        wget https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
        tar -xf zig-x86_64-linux-0.14.1.tar.xz

    - name: Build all examples
      working-directory: ${{github.workspace}}
      run: |
        export PATH=$PWD/zig-x86_64-linux-0.14.1:$PATH
        export CC="zig cc -target riscv64-linux-musl"
        export CXX="zig c++ -target riscv64-linux-musl"
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DSTRIPPED=ON -DCMAKE_TOOLCHAIN_FILE=cmake/zig-toolchain.cmake
        cmake --build build --parallel 8

